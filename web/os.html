<div class="board" id="board">
<div id="wall" aria-hidden="true"></div>
<div class="os" id="os">
  <header class="menubar">
    <div class="sysmenu">
      <button type="button" class="logo" id="logoBtn" data-act="menu" aria-haspopup="true" aria-expanded="false" aria-controls="sysMenu"><span aria-hidden="true">◆</span> Roy OS<em id="liveTag" hidden>Stale</em></button>
      <div class="menu" id="sysMenu" hidden>
        <div class="mhead">This week’s world</div>
        <div class="mtheme" id="mTheme"></div>
        <div class="mhead">Wallpaper</div>
        <div class="mtimes" id="mWalls"></div>
        <div class="msep"></div>
        <button type="button" class="mitem" data-act="fs">Full screen</button>
        <button type="button" class="mitem" data-act="refresh">Refresh now</button>
        <form method="post" action="/logout" style="display:contents"><button type="submit" class="mitem">Sign out</button></form>
      </div>
    </div>
    <nav class="apps" id="apps" aria-label="Apps"></nav>
    <div class="island" id="island">
      <button type="button" class="isl-pill" id="islPill" data-act="island" aria-expanded="false" aria-controls="islPanel"></button>
      <div class="isl-panel" id="islPanel"></div>
    </div>
    <span class="mdate" id="trDate"></span><span class="mtime" id="trTime"></span>
  </header>

  <div class="clockw"><div class="hm" id="clock">--:--</div><div class="d" id="dateline"></div><div class="g" id="greet"></div></div>

  <section class="t focus" id="wFocus" data-open="focus" aria-labelledby="hFocus">
    <div class="tl"><span class="dot"></span><span class="tt" id="hFocus">Focus</span><b id="focusCount"></b></div>
    <div class="winif" id="winIf"></div>
    <div class="todos" id="focusTodos"></div>
  </section>

  <section class="t show" id="wBoss" aria-labelledby="bossTitle">
    <div class="tl"><span class="dot"></span><span class="tt" id="bossTitle">Goku vs the boss</span><b id="bossHabits" data-tip="@habits"></b></div>
    <button type="button" class="srow" id="bossSide" data-act="card" data-card="boss" data-tip="@boss"></button>
    <button type="button" class="srow" id="gokuSide" data-act="card" data-card="goku" data-tip="@goku"></button>
  </section>

  <section class="t me" id="wMe" data-open="body" aria-labelledby="hMe">
    <div class="tl"><span class="dot"></span><span class="tt" id="hMe">Me today</span><b class="mut" id="meSay"></b></div>
    <div class="g2" id="meBody"></div>
  </section>

  <button type="button" class="wquote" id="quote" data-open="quest" hidden></button>

  <section class="t wx" id="wWx" data-tip="@weather" aria-label="Weather at home">
    <div class="wx-top">
      <div class="wx-sky" id="wxSky" aria-hidden="true"></div>
      <div><div class="tmp" id="wxTemp"></div><div class="s" id="wxTxt"></div></div>
      <div class="wx-side" id="wxSide"></div>
    </div>
    <div class="wx-hrs" id="wxHrs" aria-hidden="true"></div>
  </section>

  <section class="t dates" id="wDates" data-open="dates" data-tip="@dates" aria-labelledby="hDates">
    <div class="tl"><span class="dot"></span><span class="tt" id="hDates">Coming up</span></div>
    <div id="datesBody"></div>
  </section>

  <section class="t steph" id="wSteph" data-open="steph" data-tip="@steph" aria-labelledby="hSteph">
    <div class="tl"><span class="dot"></span><span class="tt" id="hSteph">From Steph</span><b id="stephCount"></b></div>
    <p id="stephBody"></p>
  </section>

  <section class="t mood" id="wMood" data-open="mood" aria-labelledby="hMood">
    <div class="tl"><span class="dot"></span><span class="tt" id="hMood">Mood</span><b class="mut" id="moodLast" data-tip="@lastmood"></b></div>
    <div class="faces moods" id="moodFaces" role="group" aria-label="Log your mood"></div>
  </section>

  <section class="t comm" id="wCommute" data-open="commute" data-tip="@commute" aria-labelledby="hComm">
    <div class="tl"><span class="dot"></span><span class="tt" id="hComm">Commute</span><b id="commRide"></b></div>
    <div class="cg" id="commBody"></div>
    <div class="cnote" id="commNote"></div>
  </section>

  <section class="t day" aria-labelledby="hDay">
    <div class="tl"><span class="dot"></span><span class="tt" id="hDay">Your day</span><b class="mut hours" id="dayHours"></b></div>
    <div class="lanes" id="lanes"></div>
  </section>

  <section class="t askt" id="wAsk" aria-labelledby="hAsk">
    <div class="tl"><span class="dot"></span><span class="tt" id="hAsk">Ask Claude</span></div>
    <button type="button" class="try" id="askTry" data-act="sugg"></button>
    <form class="askin" id="askForm" autocomplete="off"><span class="star" aria-hidden="true">✦</span><label class="sr" for="askIn">Ask Claude</label><input id="askIn" type="text" maxlength="240" placeholder="Tell it what changed today"><button type="submit" id="askBtn">Ask</button></form>
    <div class="askpop" id="askPop" hidden></div>
  </section>

  <div class="critters" id="critters" aria-hidden="true"></div>
</div>
</div>

<div class="lock" id="lock" role="button" tabindex="-1" aria-label="Night: the screen is off. Tap to wake it"></div>
<div class="pop" id="moodPop" hidden><form id="moodForm" autocomplete="off"><img id="moodPopImg" alt=""><label class="sr" for="moodNote">A few words about your mood</label><input class="inp" id="moodNote" type="text" maxlength="80" placeholder="A few words (optional)"><button type="submit" class="btn primary">Log</button></form></div>
<div id="winLayer"></div>
<div class="cardpop" id="cardPop" role="dialog" aria-modal="true" aria-label="Card" hidden>
  <div class="cardbox">
    <div class="cardtabs" role="tablist"><button type="button" role="tab" data-act="card" data-card="boss" id="ctBoss">Boss</button><button type="button" role="tab" data-act="card" data-card="goku" id="ctGoku">Goku</button><button type="button" class="cx" data-act="cardclose" aria-label="Close the card"><i data-ic="x"></i></button></div>
    <div class="phone" id="cardPhone"></div>
  </div>
</div>
<div id="notes" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>
